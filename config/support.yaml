# Reconstructed bench defaults. Distances are not measured vehicle clearances.
odom_to_tf:
  ros__parameters:
    parent_frame: odom
    child_frame: base_link
laser_safety_stop:
  ros__parameters:
    scan_frame: laser
    stop_distance: 1.0
    scan_timeout: 0.5
    min_valid_fraction: 0.5
cmd_vel_mux:
  ros__parameters:
    command_timeout: 0.5
    safety_timeout: 0.3
    max_speed: 0.3
    max_yaw_rate: 0.3
